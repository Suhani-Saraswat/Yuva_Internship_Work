<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interactive Task Manager</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <section class="app">
      <header>
        <h1>Interactive Task Manager</h1>
        <p>Add, complete, filter and manage your daily tasks.</p>
        <button id="themeBtn" class="secondary">🌙 Dark Mode</button>
      </header>

      <form id="taskForm" novalidate>
        <input id="taskInput" type="text" placeholder="Enter a task..." maxlength="80">
        <button type="submit">Add Task</button>
      </form>
      <p id="error" class="error"></p>

      <div class="toolbar">
        <div class="filters">
          <button class="filter active" data-filter="all">All</button>
          <button class="filter" data-filter="active">Active</button>
          <button class="filter" data-filter="completed">Completed</button>
        </div>
        <button id="clearCompleted" class="danger">Clear Completed</button>
      </div>

      <ul id="taskList"></ul>
      <p id="emptyState">No tasks yet. Add your first task!</p>

      <footer>
        <span id="taskCount">0 tasks</span>
        <button id="clearAll" class="link-btn">Clear All</button>
      </footer>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
